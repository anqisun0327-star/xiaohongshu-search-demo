name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - index.html
      - cloudflare.config.ts
      - cloudflare-build.mjs
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Cloudflare CLI
        run: npm ci
      - name: Prepare the single-page site
        run: npm run build
      - name: Deploy with cf CLI
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
