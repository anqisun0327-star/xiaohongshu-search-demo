function summaryBody(full=false,q=state.resultQuery){if(/sydney|悉尼|咖啡|brunch|cafe|餐|美食/i.test(q))return `<p>悉尼的Brunch选择超多，从网红创意菜到海边风景餐，可以根据你的喜好来挑。</p><p><b>✨ 口碑爆款，闭眼冲</b></p><p>这几家是悉尼Brunch界的人气王，虽然名气大，但味道确实有独到之处，很多人愿意专程去吃。</p><ul><li><strong>Ellen</strong>：这家店被很多食客评为“悉尼第一”，尤其是鱼堡（Fish Burger），外焦里嫩，口感惊艳。如果你追求极致的味蕾体验，这家不会让你失望。</li>${full?`<li><strong>Truffles</strong>：以创意和味道出圈，把亚洲风味和西式Brunch结合得很好。招牌的chili oil noodles（辣椒油意面）被很多人推荐，香气浓郁，非常开胃。</li><li><strong>Paramount Coffee Project</strong>：位于City，是网红打卡地。招牌的炸鸡华夫饼是咸甜口味的“永动机”，值得一试。不过有用户反馈周末需要排队。</li></ul><h3>☕️ 想慢慢吃一顿早餐</h3><p>Henry Lee’s、Cuppa Flower 和 Berto’s Espresso 都是不错的选择。可以按位置、预算和喜欢的菜式继续筛选，出发前再看看店铺营业时间。</p><p style="font-size:12px;color:#aaa">根据此 Demo 内置笔记整理，仅用于交互演示。</p>`:'</ul>'}`;return `<p>关于「${esc(q)}」，可以先看看大家的真实分享，再结合你的具体需求来选择。</p><p><b>✨ 先看经验，再做选择</b></p><p>优先关注近期发布、描述具体、有实拍图片的笔记，结合不同用户的体验交叉参考。</p><ul><li><strong>看真实体验</strong>：收藏对自己有帮助的细节，用筛选功能查看最新内容。</li>${full?'<li><strong>缩小范围</strong>：补充预算、场景、时间等条件，可以更快找到相关内容。</li></ul><p style="font-size:12px;color:#aaa">此回答为本地演示内容，未连接真实搜索或 AI 服务。</p>':'</ul>'}`}

function filteredNotes(){let ns=[...notes];const f=state.filters;if(state.tab==='视频'||f.kind==='视频')ns=ns.filter(n=>n.kind==='视频');else if(f.kind==='图文')ns=ns.filter(n=>n.kind==='图文');else if(f.kind==='直播')ns=[];if(f.time==='一天内')ns=ns.filter(n=>n.age<=1);if(f.time==='一周内')ns=ns.filter(n=>n.age<=7);if(f.time==='半年内')ns=ns.filter(n=>n.age<=180);if(f.scope==='已看过')ns=ns.filter(n=>state.seen.has(n.id));if(f.scope==='未看过')ns=ns.filter(n=>!state.seen.has(n.id));if(f.scope==='已关注')ns=ns.filter(n=>state.follows.has(n.author));if(state.tag!=='综合'&&state.tag!=='最新'&&['高性价比','必吃榜','平价推荐','漂亮饭'].includes(state.tag))ns=ns.filter(n=>n.tags.includes(state.tag));if(f.sort==='最新'||state.tag==='最新')ns.sort((a,b)=>a.age-b.age);if(f.sort==='最多点赞')ns.sort((a,b)=>b.likes-a.likes);if(f.sort==='最多收藏')ns.sort((a,b)=>b.saves-a.saves);if(f.sort==='最多评论')ns.sort((a,b)=>b.comments-a.comments);if(f.distance==='同城')ns=ns.filter(n=>n.id!==4);if(f.distance==='附近')ns=ns.filter(n=>[1,3,6,8].includes(n.id));return ns}
function noteCard(n,{imageOnly=false,product=false}={}){return `<article class="note-card" data-action="${product?'product':'note'}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title)}"><div class="cover">${img(n.image,'',n.title)}${n.kind==='视频'&&!product?`<span class="video-badge">${icon('play')}</span>`:''}</div>${imageOnly?'':`<div class="card-copy"><h2 class="note-title">${product?'悉尼 Brunch 双人餐 · '+n.author:esc(n.title)}</h2>${product?'<div class="product-price"><small>¥</small> 128 <small>起</small></div>':`<div class="card-meta">${img(n.avatar,'avatar',n.author)}<div class="author-meta"><span class="author-name">${esc(n.author)}</span><span class="post-date">${n.date}</span></div><button class="small-like ${state.likes.has(n.id)?'liked':''}" aria-label="${state.likes.has(n.id)?'取消点赞':'点赞'} ${esc(n.title)}" aria-pressed="${state.likes.has(n.id)}" data-action="like" data-id="${n.id}">${icon('heart')}<span>${n.likes+(state.likes.has(n.id)?1:0)}</span></button></div>`}</div>`}</article>`}

function filterPanel(){const groups=[['sort','排序依据',['综合','最新','最多点赞','最多评论','最多收藏']],['kind','笔记类型',['不限','视频','图文','直播']],['time','发布时间',['不限','一天内','一周内','半年内']],['scope','搜索范围',['不限','已看过','未看过','已关注']],['distance','位置距离',['不限','同城','附近']]];return `<button class="filter-shade" aria-label="收起筛选" data-action="close-filter"></button><section class="filter-panel" aria-label="搜索筛选"><div class="filter-groups">${groups.map(([key,label,options])=>`<div class="filter-group"><div class="filter-label">${label}</div><div class="filter-options">${options.map(o=>`<button class="filter-option ${state.filters[key]===o?'selected':''}" aria-pressed="${state.filters[key]===o}" data-action="filter" data-key="${key}" data-value="${o}">${o}</button>`).join('')}</div></div>`).join('')}</div><div class="filter-footer"><button data-action="reset-filters">${icon('reset')}重置</button><button data-action="close-filter">${icon('up')}收起</button></div></section>`}
function detailPage(){const n=getNote();const galleries=n.gallery||[n.image];const count=n.comments+(state.comments[n.id]?.length||0);return `<section class="page detail-page" aria-label="笔记详情"><header class="detail-header"><button class="back" data-action="back" aria-label="返回搜索结果">${icon('back')}</button><button class="detail-author" data-action="profile" data-value="${esc(n.author)}">${img(n.avatar,'',n.author)}<span>${esc(n.author)}</span></button><button class="follow ${state.follows.has(n.author)?'followed':''}" data-action="follow" data-value="${esc(n.author)}">${state.follows.has(n.author)?'已关注':'关注'}</button><button class="detail-share" aria-label="分享笔记" data-action="share">${icon('share')}</button></header><div class="detail-scroll"><div class="carousel" id="carousel">${img(galleries[state.slide%galleries.length],'',n.title)}<span class="live-badge">◎ 实况⌄</span><span class="media-index">${state.slide+1}/${galleries.length}</span><button class="carousel-prev" data-action="prev-slide" aria-label="上一张图片">${icon('back')}</button><button class="carousel-next" data-action="next-slide" aria-label="下一张图片">${icon('chevron')}</button>${n.kind==='视频'?`<button class="video-toggle" aria-label="${state.videoPlaying?'暂停':'播放'}视频演示" data-action="toggle-video" style="position:absolute;bottom:16px;right:15px;width:42px;height:42px;border-radius:50%;background:#0006;color:#fff">${icon(state.videoPlaying?'pause':'play')}</button>`:''}</div><div class="carousel-dots">${galleries.map((_,i)=>`<button class="${state.slide===i?'active':''}" data-action="slide" data-index="${i}" aria-label="查看第 ${i+1} 张图片"></button>`).join('')}</div><div class="detail-copy"><h1>${esc(n.title.split(' p1-2)')[0])}</h1><p>${esc(n.text).replace(/\n/g,'<br>')}</p><p class="hashtags"><button data-action="search" data-value="悉尼brunch">#悉尼brunch</button> <button data-action="search" data-value="悉尼美食">#悉尼美食</button> <button data-action="search" data-value="周末探店">#周末探店</button></p><div class="detail-date">${n.date} 澳大利亚</div></div><div class="detail-inline-comments"><p>共 ${count} 条评论</p>${commentRows(n.id,true)}<button data-action="comments" style="color:#999;font-size:13px;padding:0 0 10px 34px">展开全部评论 ${icon('chevron')}</button></div></div><footer class="detail-footer"><button class="comment-trigger" data-action="comments">${icon('edit')}说点什么...</button><button class="detail-action ${state.likes.has(n.id)?'liked':''}" data-action="like" data-id="${n.id}" aria-label="${state.likes.has(n.id)?'取消点赞':'点赞'}" aria-pressed="${state.likes.has(n.id)}">${icon('heart')}<span>${n.likes+(state.likes.has(n.id)?1:0)}</span></button><button class="detail-action ${state.saves.has(n.id)?'saved':''}" data-action="save-note" data-id="${n.id}" aria-label="${state.saves.has(n.id)?'取消收藏':'收藏'}" aria-pressed="${state.saves.has(n.id)}">${icon('star')}<span>${n.saves+(state.saves.has(n.id)?1:0)}</span></button><button class="detail-action" data-action="comments" aria-label="查看评论">${icon('comment')}<span>${count}</span></button></footer></section>`}
function commentRows(id,short=false){const custom=(state.comments[id]||[]).map((text,i)=>({name:'我',avatar:'sylvia',text,likes:0,time:'刚刚',own:true,index:i}));const base=[{name:'今天也要好好吃饭',avatar:'purpleauthor',text:'收藏了！下次周末就去吃这家～',likes:8,time:'2天前'},{name:'小鱼的周末',avatar:'yumiko',text:'悉尼的 brunch 真的太多宝藏了 ☕️',likes:5,time:'3天前'},{name:'咖啡和晴天',avatar:'outdoorauthor',text:'看起来好好吃，请问周末需要提前预约吗？',likes:3,time:'3天前'},{name:'Sylviaa',avatar:'sylvia',text:'建议早点去哦，人多的话可能需要等位～',likes:2,time:'3天前'}];let cs=[...custom,...base];if(short)cs=cs.slice(0,2);return cs.map(c=>`<div class="comment-row">${img(c.avatar,'avatar',c.name)}<div class="comment-text"><div class="comment-author">${c.name}${c.own?' <span style="font-size:10px;background:#f6f6f6;padding:1px 4px;border-radius:3px">我</span>':''}</div><p>${esc(c.text)}</p><small>${c.time} · 澳大利亚</small> <button style="color:#aaa;font-size:11px" data-action="reply" data-value="${esc(c.name)}">回复</button>${c.own?` <button style="color:#bbb;font-size:11px" data-action="delete-comment" data-index="${c.index}">删除</button>`:''}</div><button class="small-like" aria-label="赞这条评论" data-action="like-comment">${icon('heart')}<span>${c.likes||'赞'}</span></button></div>`).join('')}

function followupAnswer(q){if(/100|预算|平价|便宜|人均/.test(q))return '<p>想控制预算，可以优先看看这几种选择：</p><ul><li><strong>咖啡 + 单人早餐</strong>：比一次点完整桌的分享餐更容易控制人均。</li><li><strong>Berto’s Espresso</strong>：可以先看看早餐三明治和咖啡组合。</li><li><strong>先筛选“平价推荐”</strong>：结合近期笔记里的菜单、份量和人均信息做选择。</li></ul><p style="color:#aaa;font-size:12px">这是本地交互演示回答，价格与店铺信息请以实际为准。</p>';if(/拍照|好看|出片/.test(q))return '<p>如果更看重拍照，可以从这几家开始看：</p><ul><li><strong>Cuppa Flower</strong>：摆盘丰富，适合拍一整桌 brunch。</li><li><strong>Auvers</strong>：明亮的空间和色彩丰富的菜品。</li><li><strong>Surry Hills 的户外座位</strong>：绿植、阳光和咖啡很适合周末随手拍。</li></ul><p>建议避开中午最强的直射光，靠窗或户外阴影位置更舒服。</p>';if(/区|位置|附近|路线/.test(q))return '<p>可以按区域安排，不用为了吃一顿 brunch 来回跑：</p><ul><li><strong>City / Surry Hills</strong>：Paramount Coffee Project、Berto’s Espresso，适合搭配周末散步。</li><li><strong>Redfern</strong>：Henry Lee’s，可以顺路探店。</li><li><strong>Camperdown</strong>：Ellen，适合悉大附近的早餐计划。</li></ul><p>回到结果页后，也可以使用“位置距离”筛选缩小范围。</p>';return `<p>你想进一步了解「${esc(q)}」。可以结合以下几点继续找：</p><ul><li><strong>具体场景</strong>：是日常使用、周末探店，还是做攻略？</li><li><strong>筛选条件</strong>：把预算、位置和时间补充进去，搜索会更聚焦。</li><li><strong>参考笔记</strong>：点开上方来源，对照真实图片和用户经验。</li></ul><p style="font-size:12px;color:#aaa">此为本地演示回答，未连接在线 AI。</p>`}

const actions={
'back':()=>back(),
'open-search':()=>{navigate('search',{query:'',historyEdit:false});focusSearch()},
'search':el=>{closeOverlay();submitSearch(el.dataset.value||state.query)},
'fill-query':el=>updateQuery(el.dataset.value,true),
'clear-query':()=>updateQuery('',true),
'expand-history':()=>{state.historyExpanded=!state.historyExpanded;render()},
'edit-history':()=>{state.historyEdit=true;state.historyExpanded=true;render()},
'finish-history':()=>{state.historyEdit=false;state.historyExpanded=false;render()},
'remove-history':el=>{state.history=state.history.filter(h=>h!==el.dataset.value);save('history',state.history);render()},
'clear-history':()=>confirmDialog('删除全部搜索历史？','删除后将无法恢复。仅影响此 Demo 在本机保存的记录。','confirm-clear-history','全部删除'),
'confirm-clear-history':()=>{state.history=[];state.historyEdit=false;save('history',state.history);closeOverlay();render()},
'recommend-menu':()=>{state.recommendMenu=!state.recommendMenu;render()},
'refresh-recommend':()=>{state.recommendSet++;state.recommendMenu=false;render()},
'close-recommend':()=>{state.recommendMenu=false;render()},
'voice':()=>openVoice(),'voice-tap':()=>{if(!voiceStarted){startVoice();voiceTimer=setTimeout(endVoice,750)}},'voice-example':()=>finishVoice(),
'camera':()=>$('#image-upload').click(),
'tab':el=>{const t=el.dataset.value;if(t==='全部'&&state.tab==='全部'){state.filterOpen=!state.filterOpen;render(true)}else{state.tab=t;state.filterOpen=false;render()}},
'filter':el=>{state.filters[el.dataset.key]=el.dataset.value;state.tag=state.filters.sort==='最新'?'最新':'综合';render(true)},
'reset-filters':()=>{state.filters={...defaults};state.tag='综合';render(true)},
'close-filter':()=>{state.filterOpen=false;render(true)},
'context-tag':el=>{const t=el.dataset.value;if(['悉尼city','周末探店'].includes(t)){submitSearch(t);return}state.tag=t;if(t==='最新')state.filters.sort='最新';else if(t==='综合')state.filters.sort='综合';render()},
'more-notes':()=>{const e=$('.results-scroll');if(e)e.scrollTo({top:0,behavior:'smooth'})},
'note':el=>openNote(el.dataset.id),
'like':el=>{const id=Number(el.dataset.id);state.likes.has(id)?state.likes.delete(id):state.likes.add(id);persist();render(true)},
'save-note':el=>{const id=Number(el.dataset.id);const adding=!state.saves.has(id);adding?state.saves.add(id):state.saves.delete(id);persist();render(true);toast(adding?'已收藏':'已取消收藏')},
'follow':el=>{const name=el.dataset.value;const adding=!state.follows.has(name);adding?state.follows.add(name):state.follows.delete(name);persist();render(true)},
'profile':el=>navigate('profile',{profile:el.dataset.value,profileTab:'笔记'}),
'my-profile':()=>navigate('profile',{profile:'我',profileTab:'收藏'}),
'profile-tab':el=>{state.profileTab=el.dataset.value;render(true)},
'comments':()=>openComments(),'reply':el=>openComments(el.dataset.value),
'like-comment':el=>{const b=el.classList.toggle('liked');const s=el.querySelector('span');if(!el.dataset.original)el.dataset.original=s.textContent;s.textContent=b?(Number(el.dataset.original)||0)+1:el.dataset.original},
'delete-comment':el=>{state.comments[state.detailId]?.splice(Number(el.dataset.index),1);persist();render(true);openComments()},
'prev-slide':()=>moveSlide(-1),'next-slide':()=>moveSlide(1),'slide':el=>{state.slide=Number(el.dataset.index);render(true)},
'viewer-prev':()=>moveSlide(-1,true),'viewer-next':()=>moveSlide(1,true),
'share':()=>shareSheet(),'close-overlay':()=>closeOverlay(),
'dismiss-overlay':(el,e)=>{if(e.target===el)closeOverlay()},
'copy-link':()=>copyText(location.href),
'save-image':()=>{const n=getNote();const a=document.createElement('a');a.href=ASSETS[n.gallery[state.slide]||n.image];a.download='小红书笔记图片-'+n.id+'.jpg';a.click();toast('图片已保存')},
'share-preview':el=>{showSheet('分享预览',`<div class="sheet-scroll" style="text-align:center;padding:25px"><div style="border:1px solid #eee;border-radius:12px;overflow:hidden;text-align:left">${img(getNote().image,'','分享预览')}<p style="padding:0 12px;line-height:22px">${esc(getNote().title)}</p></div><p style="color:#aaa;font-size:12px;line-height:20px">${esc(el.dataset.value)}分享预览 · 此 Demo 不会发送真实消息</p></div>`,{footer:'<button class="sheet-cancel" data-action="close-overlay">完成</button>'})},
'feedback':()=>{showSheet('反馈',`<form id="feedback-form" style="padding:20px"><textarea aria-label="反馈内容" required placeholder="描述你遇到的问题或建议" style="width:100%;height:110px;resize:none;padding:12px;background:#f6f6f6;border-radius:10px"></textarea><button class="send-comment" style="height:40px;width:100%;margin-top:15px">提交</button><p style="font-size:11px;color:#aaa;text-align:center">反馈仅保存在此 Demo 的本机浏览器中</p></form>`)},
'ask':()=>ask(),'references':()=>refsSheet(),
'ai-tools':()=>showSheet('更多提问方式',`<div class="share-row"><button class="share-option" data-action="camera"><span class="share-circle">${icon('image')}</span>上传图片</button><button class="share-option" data-action="voice"><span class="share-circle">${icon('mic')}</span>语音提问</button><button class="share-option" data-action="new-ai"><span class="share-circle">${icon('plus')}</span>新对话</button></div>`),
'reference-note':el=>{closeOverlay();openNote(el.dataset.id)},
'ai-followup':el=>sendAI(el.dataset.value),
'ai-menu':()=>showSheet('更多选项','<div class="sheet-scroll"><button data-action="new-ai" style="width:100%;height:48px;text-align:left">＋ 开启新对话</button><button data-action="copy-link" style="width:100%;height:48px;text-align:left">复制对话链接</button></div>'),
'new-ai':()=>{clearTimeout(aiTimer);state.aiBusy=false;closeOverlay();state.aiMessages=[];render();$('#ai-input')?.focus()},
'copy-answer':el=>{const m=state.aiMessages[Number(el.dataset.index)];const temp=document.createElement('div');temp.innerHTML=m.initial?summaryBody(true,m.text):followupAnswer(m.text);copyText(temp.textContent)},
'helpful':el=>{el.classList.toggle('liked');toast(el.classList.contains('liked')?'感谢反馈':'已取消反馈')},
'home':()=>{state.page='home';render()},
'home-tab':el=>{state.homeTab=el.dataset.value;render()},
'home-category':el=>{state.homeCategory=el.dataset.value;if(el.dataset.value==='直播'){state.homeTab='发现';render();showSheet('直播','<div class="empty" style="padding:65px 20px">当前没有正在进行的演示直播<br><small>试试搜索更多感兴趣的内容</small></div>')}else{render();if(el.dataset.value!=='推荐'){const feed=$('.home-feed');if(feed)feed.innerHTML=gridMarkup([...notes].sort((a,b)=>((a.id+el.dataset.value.length)%3)-((b.id+el.dataset.value.length)%3)))}}},
'home-menu':()=>showSheet('更多','<div class="sheet-scroll"><button data-action="open-search" style="display:block;width:100%;text-align:left;padding:17px">搜索笔记、用户和商品</button><button data-action="my-profile" style="display:block;width:100%;text-align:left;padding:17px">我的收藏与赞过</button><button data-action="demo-info" style="display:block;width:100%;text-align:left;padding:17px">关于此 Demo</button></div>'),
'demo-info':()=>showSheet('关于此 Demo','<div class="sheet-scroll" style="padding:24px;font-size:13px;line-height:25px"><p>根据 iPhone 镜像中的小红书界面制作，重点还原搜索流程。</p><p>数据、点赞、收藏、历史和评论均保存在本机浏览器。搜索、语音和点点回答使用演示数据。</p><p>未连接真实小红书账号、在线搜索或 AI 服务。</p></div>'),
'market':()=>showSheet('市集',`<div class="sheet-scroll">${gridMarkup(notes.slice(0,4),{product:true})}</div>`),
'product':el=>{closeOverlay();const n=getNote(el.dataset.id);showSheet('商品详情',`<div class="sheet-scroll">${img(n.image,'','商品演示图片')}<h3>悉尼 Brunch 双人餐 · ${esc(n.author)}</h3><p class="product-price">¥128 起</p><p style="font-size:12px;color:#aaa">本地商品展示示例，无实际购买功能。</p></div>`,{footer:'<button class="sheet-cancel" data-action="close-overlay">返回</button>'})},
'publish':()=>showSheet('发布',`<div class="sheet-scroll" style="padding:35px;text-align:center"><button data-action="camera" style="display:inline-grid;place-items:center;width:90px;height:90px;border-radius:15px;background:#f5f5f5">${icon('plus')}</button><p style="font-size:13px;color:#999">选择一张图片，体验以图搜图</p></div>`),
'messages':()=>showSheet('消息','<div class="sheet-scroll"><div style="display:flex;justify-content:space-around;padding:25px 0">'+['赞和收藏','新增关注','评论和@'].map(t=>`<button data-action="notification" data-value="${t}" style="font-size:12px;text-align:center"><span style="display:grid;place-items:center;width:49px;height:49px;background:#fff2f3;color:#ff536f;border-radius:15px;margin:0 auto 10px">${icon(t==='赞和收藏'?'heart':t==='新增关注'?'user':'comment')}</span>${t}</button>`).join('')+'</div><div class="empty" style="padding:45px 0">还没有新消息</div></div>'),
'notification':el=>showSheet(el.dataset.value,'<div class="empty" style="padding:60px 20px">暂无消息</div>'),
'toggle-video':()=>{state.videoPlaying=!state.videoPlaying;clearInterval(videoInterval);if(state.videoPlaying){toast('播放图片轮播演示');videoInterval=setInterval(()=>{if(state.page!=='detail'||!state.videoPlaying){clearInterval(videoInterval);return}moveSlide(1)},1800)}render(true)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){if(el.dataset.action==='dismiss-overlay'&&e.target!==el)return;const handler=actions[el.dataset.action];if(handler){e.preventDefault();handler(el,e);return}}if(e.target.closest('#carousel')&&!e.target.closest('button')){if(suppressMediaClick){suppressMediaClick=false;return}showImage()}});
document.addEventListener('focusin',e=>{if(e.target.id==='search-input'&&state.page==='results'){const q=state.resultQuery;navigate('search',{query:q});focusSearch()}});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){updateQuery(e.target.value)}if(e.target.id==='ai-input'){const has=e.target.value.trim().length>0;$('#ai-send').outerHTML=has?`<button class="icon-btn" id="ai-send" type="submit" aria-label="发送提问">${icon('send')}</button>`:`<button class="icon-btn" id="ai-send" type="button" aria-label="更多提问方式" data-action="ai-tools">${icon('addcircle')}</button>`} });
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();submitSearch($('#search-input').value)}if(e.target.id==='comment-form'){e.preventDefault();const text=$('#comment-input').value.trim();if(!text){toast('先写点什么吧');return}if(text.length>500){toast('评论最多500字');return}state.comments[state.detailId]??=[];state.comments[state.detailId].unshift(text);persist();render(true);openComments();toast('评论成功')}if(e.target.id==='ai-form'){e.preventDefault();sendAI($('#ai-input').value)}if(e.target.id==='feedback-form'){e.preventDefault();const val=e.target.querySelector('textarea').value.trim();if(!val)return;const feedback=load('feedback',[]);feedback.push({text:val,date:new Date().toISOString()});save('feedback',feedback);closeOverlay();toast('反馈已保存到本机')}});
let swipeStart=null,suppressMediaClick=false;
document.addEventListener('pointerdown',e=>{if(e.target.closest('.voice-orb')){e.preventDefault();startVoice();return}if(e.target.closest('#carousel,.image-viewer'))swipeStart={x:e.clientX,y:e.clientY}});
document.addEventListener('pointerup',e=>{if(voiceStarted){e.preventDefault();endVoice();return}if(swipeStart){const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){suppressMediaClick=true;moveSlide(dx<0?1:-1,!!$('.image-viewer'));setTimeout(()=>suppressMediaClick=false,350)}swipeStart=null}});
document.addEventListener('pointercancel',()=>{if(voiceStarted)endVoice();swipeStart=null});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'');if(e.key==='Escape'){e.preventDefault();back();return}if($('#overlay').innerHTML&&e.key==='Tab'){const els=[...$('#overlay').querySelectorAll('button,input,textarea,[tabindex="0"]')].filter(el=>!el.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault()}return}if(!typing&&state.page==='detail'&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();moveSlide(e.key==='ArrowRight'?1:-1,!!$('.image-viewer'))}if(!typing&&e.key==='Enter'&&document.activeElement?.matches('[role="button"]'))document.activeElement.click();if(e.target.id==='search-input'&&e.key==='ArrowDown'){$('.suggestion-label')?.focus();e.preventDefault()}});
$('#image-upload').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(!file.type.startsWith('image/')){toast('请选择图片文件');return}if(file.size>12*1024*1024){toast('请选择12MB以内的图片');return}const reader=new FileReader();reader.onload=()=>{closeOverlay();navigate('results',{query:'',resultQuery:'以图搜图',tab:'图片',imageSearch:reader.result,filters:{...defaults},tag:'综合'})};reader.onerror=()=>toast('图片读取失败，请重试');reader.readAsDataURL(file)});
function resize(){if(innerWidth<=440){document.documentElement.style.setProperty('--scale','1');return}const scale=Math.min(1,(innerHeight-58)/868,(innerWidth-48)/409);document.documentElement.style.setProperty('--scale',String(Math.max(.35,scale)))}window.addEventListener('resize',resize);resize();render();
</script></body></html>
